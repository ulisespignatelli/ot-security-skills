name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Manifiestos y SKILL.md válidos
        run: |
          python - <<'PY'
          import json, re, pathlib, sys
          json.load(open(".claude-plugin/marketplace.json"))
          for p in pathlib.Path("plugins").glob("*/.claude-plugin/plugin.json"):
              json.load(open(p))
          for s in pathlib.Path("plugins").glob("*/skills/*/SKILL.md"):
              m = re.match(r"---\nname: (.+)\ndescription: (.+)\n---", s.read_text(encoding="utf-8"))
              assert m, f"{s}: falta el encabezado name/description"
              assert m.group(1) == s.parent.name, f"{s}: name debe coincidir con la carpeta"
              assert len(m.group(2)) <= 200, f"{s}: la descripción supera los 200 caracteres de Claude.ai"
          print("ok")
          PY

  # En cada tag (v1.0.0, …) arma el ZIP de cada skill para subir a Claude.ai.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empaquetar skills
        run: |
          mkdir -p dist
          for d in plugins/*/skills/*/; do
            name=$(basename "$d")
            (cd "$(dirname "$d")" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" "$name" -x '*/__pycache__/*')
          done
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
